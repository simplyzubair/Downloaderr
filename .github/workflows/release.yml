name: Build and release Downloaderr

# Every push to main that changes the app becomes release v0.2.<run number>.
# Installed apps see the new release, download it in the background and show "Update now".
# Website and docs changes do not make a release. Never tag releases by hand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'deploy/**', 'scripts/deploy-website.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and test with a read-only token; npm packages never see a token that can publish.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=$VERSION"
      - name: Installer regression test (needs the NSIS compiler from the build)
        run: node --test tests/installer-arguments.test.mjs
        env:
          AWESOME_REQUIRE_NSIS: '1'
      - name: Check the update file names this version
        shell: bash
        run: |
          grep -qE "^version: ${VERSION}[[:space:]]*$" release/latest.yml
      - name: Create SHA-256 file
        shell: powershell
        run: (Get-FileHash release/Downloaderr-Setup.exe -Algorithm SHA256).Hash.ToLower() + '  Downloaderr-Setup.exe' | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            release/Downloaderr-Setup.exe
            release/Downloaderr-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

  # Only this small job can write: it uploads the tested files as a release.
  # Branch runs (workflow_dispatch on a test branch) stop after the build.
  publish:
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          gh release create "v$VERSION" --target "${{ github.sha }}" --title "Downloaderr $VERSION" --generate-notes             Downloaderr-Setup.exe Downloaderr-Setup.exe.blockmap latest.yml SHA256SUMS.txt
