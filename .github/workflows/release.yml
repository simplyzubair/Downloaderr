name: Build and release Downloaderr

# Every push to main that changes the app builds release v0.2.<run number>.
# It is published only after the owner approves it on GitHub (environment "release").
# Installed apps then see the new release, download it in the background and show "Update now".
# Website and docs changes do not make a release. Never tag releases by hand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'deploy/**', 'scripts/deploy-website.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and test with a read-only token; npm packages never see a token that can publish.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=$VERSION"
      - name: Installer regression test (needs the NSIS compiler from the build)
        run: node --test tests/installer-arguments.test.mjs
        env:
          AWESOME_REQUIRE_NSIS: '1'
      - name: Check the update file names this version
        shell: bash
        run: |
          grep -qE "^version: ${VERSION}[[:space:]]*$" release/latest.yml
      # The browser extension as its own download, for "Load unpacked" (one folder inside the zip).
      - name: Zip the browser extension
        shell: pwsh
        run: |
          $folder = "release/extension-zip/Downloaderr-Extension"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item extension/* $folder -Recurse -Exclude *.test.cjs, manifest.firefox.json
          if (-not (Test-Path "$folder/manifest.json")) { throw 'manifest.json missing from the extension zip' }
          if (Get-ChildItem $folder -Recurse -Filter *.test.cjs) { throw 'test files in the extension zip' }
          Compress-Archive -Path $folder -DestinationPath "release/Downloaderr-Extension-$env:VERSION.zip"
      - name: Create SHA-256 file
        shell: powershell
        run: |
          $files = "Downloaderr-Setup-$env:VERSION.exe", "Downloaderr-Extension-$env:VERSION.zip"
          $files | ForEach-Object { (Get-FileHash "release/$_" -Algorithm SHA256).Hash.ToLower() + "  $_" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            release/Downloaderr-Setup-${{ env.VERSION }}.exe
            release/Downloaderr-Setup-${{ env.VERSION }}.exe.blockmap
            release/Downloaderr-Extension-${{ env.VERSION }}.zip
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

  # Unsigned Apple Silicon build for personal use (no Apple Developer ID): ad-hoc signed only,
  # so it cannot update itself; the app links to the download page when a new version is out.
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the Mac app
        run: npx electron-builder --mac --arm64 --publish never "-c.extraMetadata.version=$VERSION"
      - name: Check the app bundle
        run: |
          codesign --verify --deep --strict release/mac-arm64/Downloaderr.app
          test -x release/mac-arm64/Downloaderr.app/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg
          grep -qE "^version: ${VERSION}[[:space:]]*$" release/latest-mac.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: |
            release/Downloaderr-${{ env.VERSION }}-mac-arm64.dmg
            release/Downloaderr-${{ env.VERSION }}-mac-arm64.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 3

  # Only this small job can write: it uploads the tested files as a release.
  # Branch runs (workflow_dispatch on a test branch) stop after the build.
  publish:
    needs: [windows, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits until simplyzubair clicks "Approve and deploy" on the run page
    # (environment "release" has a required reviewer and only allows main).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          gh release create "v$VERSION" --target "${{ github.sha }}" --title "Downloaderr $VERSION" --generate-notes             "Downloaderr-Setup-$VERSION.exe" "Downloaderr-Setup-$VERSION.exe.blockmap" "Downloaderr-Extension-$VERSION.zip" latest.yml SHA256SUMS.txt             "Downloaderr-$VERSION-mac-arm64.dmg" "Downloaderr-$VERSION-mac-arm64.zip" latest-mac.yml
